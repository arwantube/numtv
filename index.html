<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Android WebTV IPTV Pro</title>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            outline: none !important;
            -webkit-tap-highlight-color: transparent;
        }
        body, html {
            width: 100%;
            height: 100%;
            background-color: #000;
            color: #fff;
            font-family: sans-serif;
            overflow: hidden;
            outline: none !important;
        }
        #video-player {
            width: 100vw;
            height: 100vh;
            object-fit: contain;
            background: #000;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
            outline: none !important;
        }
        #loading-spinner {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 60px;
            height: 60px;
            border: 6px solid rgba(255, 255, 255, 0.2);
            border-top: 6px solid #00ffcc;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            z-index: 4;
            display: none;
        }
        #stream-status-text {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.85);
            padding: 15px 25px;
            border-radius: 8px;
            font-size: 20px;
            color: #ff4d4d;
            border: 1px solid #444;
            z-index: 4;
            display: none;
            text-align: center;
        }
        @keyframes spin {
            0% { transform: translate(-50%, -50%) rotate(0deg); }
            100% { transform: translate(-50%, -50%) rotate(360deg); }
        }
        #sidebar {
            position: absolute;
            top: 0;
            left: -400px;
            width: 400px;
            height: 100vh;
            background: rgba(15, 15, 15, 0.95);
            border-right: 2px solid #333;
            z-index: 10;
            transition: left 0.3s ease-in-out;
            display: flex;
            flex-direction: column;
        }
        #sidebar.visible {
            left: 0;
        }
        .sidebar-header {
            padding: 20px;
            background: #222;
            font-size: 22px;
            font-weight: bold;
            border-bottom: 1px solid #444;
        }
        #channel-list {
            flex: 1;
            overflow-y: auto;
            padding: 10px;
        }
        .channel-item {
            padding: 15px;
            margin-bottom: 8px;
            background: #2a2a2a;
            border-radius: 6px;
            cursor: pointer;
            font-size: 18px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            border: 2px solid transparent;
        }
        .channel-item.focused {
            border-color: #00ffcc;
            background: #3a3a3a;
        }
        .channel-item.active {
            background: #0055ff;
            color: #fff;
        }
        #osd-info {
            position: absolute;
            top: 30px;
            right: 30px;
            background: rgba(0, 0, 0, 0.8);
            padding: 15px 25px;
            border-radius: 8px;
            font-size: 24px;
            z-index: 5;
            opacity: 0;
            transition: opacity 0.3s ease;
            border: 1px solid #444;
        }
        #osd-info.show {
            opacity: 1;
        }
    </style>
</head>
<body>

    <video id="video-player" playsinline autoplay></video>
    <div id="loading-spinner"></div>
    <div id="stream-status-text">Stream Mati</div>
    <div id="osd-info">Channel -</div>

    <div id="sidebar">
        <div class="sidebar-header">Daftar Channel TV</div>
        <div id="channel-list"></div>
    </div>

    <script>
        const playlistUrl = 'https://raw.githubusercontent.com/arwantube/playlist-iptv/refs/heads/main/tv-indonesia.m3u';
        let channels = [];
        let currentIndex = 0;
        let focusedIndex = 0;
        let isSidebarVisible = false;
        let hideSidebarTimer = null;
        let osdTimer = null;

        // Variabel penampung input nomor remot TV
        let numberBuffer = '';
        let numberTimer = null;

        const video = document.getElementById('video-player');
        const spinner = document.getElementById('loading-spinner');
        const streamStatusText = document.getElementById('stream-status-text');
        const sidebar = document.getElementById('sidebar');
        const channelListContainer = document.getElementById('channel-list');
        const osdInfo = document.getElementById('osd-info');

        async function loadPlaylist() {
            try {
                const response = await fetch(playlistUrl);
                const text = await response.text();
                parseM3U(text);
                if (channels.length > 0) {
                    renderChannelList();
                    
                    // Fitur #2: Memuat channel terakhir dari localStorage
                    const savedIndex = parseInt(localStorage.getItem('iptv_last_channel'), 10);
                    const initialIndex = (!isNaN(savedIndex) && savedIndex >= 0 && savedIndex < channels.length) ? savedIndex : 0;
                    
                    playChannel(initialIndex);
                } else {
                    showOSD("Playlist kosong!");
                }
            } catch (error) {
                console.error("Gagal memuat playlist:", error);
                showOSD("Gagal memuat playlist!");
            }
        }

        function parseM3U(data) {
            const lines = data.split('\n');
            let currentChannel = {};

            lines.forEach(line => {
                line = line.trim();
                if (line.startsWith('#EXTINF:')) {
                    const tvgNameMatch = line.match(/tvg-name="([^"]*)"/);
                    const nameParts = line.split(',');
                    currentChannel.name = tvgNameMatch ? tvgNameMatch[1] : (nameParts[nameParts.length - 1] || "Unknown Channel");
                } else if (line && !line.startsWith('#')) {
                    currentChannel.url = line;
                    if (currentChannel.url && currentChannel.name) {
                        channels.push({ ...currentChannel });
                    }
                    currentChannel = {};
                }
            });
        }

        function renderChannelList() {
            channelListContainer.innerHTML = '';
            channels.forEach((channel, index) => {
                const div = document.createElement('div');
                div.className = `channel-item ${index === 0 ? 'focused' : ''}`;
                div.innerText = channel.name;
                div.dataset.index = index;
                div.addEventListener('click', () => {
                    playChannel(index);
                    toggleSidebar(false);
                });
                channelListContainer.appendChild(div);
            });
        }

        function prepareChannel(index) {
            if (index < 0 || index >= channels.length) return;
            currentIndex = index;
            focusedIndex = index;

            // Fitur #2: Menyimpan channel terakhir yang ditonton
            localStorage.setItem('iptv_last_channel', index);

            const channel = channels[currentIndex];
            const streamUrl = channel.url;

            document.querySelectorAll('.channel-item').forEach((el, idx) => {
                el.classList.toggle('active', idx === currentIndex);
            });

            if (window.hls) {
                window.hls.destroy();
                window.hls = null;
            }

            if (Hls.isSupported() && streamUrl.includes('.m3u8')) {
                const hls = new Hls({
                    maxBufferLength: 30,
                    maxMaxBufferLength: 60,
                    liveSyncDurationCount: 3,
                });
                window.hls = hls;
                hls.loadSource(streamUrl);
                hls.attachMedia(video);
                
                hls.on(Hls.Events.ERROR, (event, data) => {
                    if (data.fatal) {
                        console.warn(`HLS Fatal error on channel ${channel.name}:`, data.details);
                        switch (data.details) {
                            case Hls.ErrorDetails.NETWORK_ERROR:
                                hls.startLoad();
                                break;
                            case Hls.ErrorDetails.MEDIA_ERROR:
                                hls.recoverMediaError();
                                break;
                            default:
                                hls.destroy();
                                handleStreamError();
                                break;
                        }
                    }
                });
            } else {
                video.src = streamUrl;
            }
        }

        function playChannel(index) {
            spinner.style.display = 'block';
            streamStatusText.style.display = 'none';
            prepareChannel(index);
            const channel = channels[currentIndex];
            showOSD(`${currentIndex + 1}. ${channel.name}`);
            
            // Fitur #1: Penanganan Autoplay Block (Mute Fallback)
            video.play().catch(e => {
                console.log("Autoplay blocked, mencoba pemutaran muted:", e);
                video.muted = true;
                video.play().then(() => {
                    showOSD(`${currentIndex + 1}. ${channel.name} (Suara Dibisukan)`);
                }).catch(err => {
                    console.error("Gagal memutar video sepenuhnya:", err);
                });
            });
        }

        function handleStreamError() {
            spinner.style.display = 'none';
            streamStatusText.style.display = 'block';
        }

        video.addEventListener('playing', () => {
            spinner.style.display = 'none';
            streamStatusText.style.display = 'none';
        });

        video.addEventListener('waiting', () => {
            spinner.style.display = 'block';
            streamStatusText.style.display = 'none';
        });

        video.addEventListener('error', () => {
            handleStreamError();
        });

        function toggleSidebar(show) {
            isSidebarVisible = show;
            if (show) {
                sidebar.classList.add('visible');
                updateFocus();
                resetHideTimer();
            } else {
                sidebar.classList.remove('visible');
                clearTimeout(hideSidebarTimer);
            }
        }

        function resetHideTimer() {
            clearTimeout(hideSidebarTimer);
            hideSidebarTimer = setTimeout(() => {
                if (isSidebarVisible) {
                    toggleSidebar(false);
                }
            }, 5000);
        }

        function showOSD(text) {
            if (text) osdInfo.innerText = text;
            osdInfo.classList.add('show');
            clearTimeout(osdTimer);
            osdTimer = setTimeout(() => {
                osdInfo.classList.remove('show');
            }, 3000);
        }

        function updateFocus() {
            const items = document.querySelectorAll('.channel-item');
            items.forEach((item, idx) => {
                if (idx === focusedIndex) {
                    item.classList.add('focused');
                    item.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
                } else {
                    item.classList.remove('focused');
                }
            });
        }

        window.addEventListener('keydown', (e) => {
            // Otomatis bunyikan suara jika sebelumnya dibisukan oleh aturan autoplay
            if (video.muted) {
                video.muted = false;
            }

            // Fitur #3: Penanganan Tombol Angka Remot TV (0-9)
            if (e.key >= '0' && e.key <= '9') {
                e.preventDefault();
                numberBuffer += e.key;
                showOSD(`Pindah ke Channel: ${numberBuffer}`);

                clearTimeout(numberTimer);
                numberTimer = setTimeout(() => {
                    const targetIndex = parseInt(numberBuffer, 10) - 1;
                    if (targetIndex >= 0 && targetIndex < channels.length) {
                        playChannel(targetIndex);
                        if (isSidebarVisible) toggleSidebar(false);
                    } else {
                        showOSD("Channel tidak ditemukan!");
                    }
                    numberBuffer = '';
                }, 1500);
                return;
            }

            if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Enter', ' '].includes(e.key)) {
                e.preventDefault();
            }

            if (isSidebarVisible) {
                switch (e.key) {
                    case 'ArrowUp':
                        if (focusedIndex > 0) {
                            focusedIndex--;
                            updateFocus();
                            resetHideTimer();
                        }
                        break;
                    case 'ArrowDown':
                        if (focusedIndex < channels.length - 1) {
                            focusedIndex++;
                            updateFocus();
                            resetHideTimer();
                        }
                        break;
                    case 'Enter':
                    case ' ':
                        playChannel(focusedIndex);
                        toggleSidebar(false);
                        break;
                    case 'ArrowLeft':
                    case 'Escape':
                    case 'Backspace':
                        toggleSidebar(false);
                        break;
                }
            } else {
                switch (e.key) {
                    case 'ArrowLeft':
                        focusedIndex = currentIndex;
                        toggleSidebar(true);
                        break;
                    case 'ArrowUp':
                        playChannel((currentIndex + 1) % channels.length);
                        break;
                    case 'ArrowDown':
                        playChannel((currentIndex - 1 + channels.length) % channels.length);
                        break;
                }
            }
        });

        loadPlaylist();
    </script>
</body>
</html>
