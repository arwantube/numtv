<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Android WebTV IPTV</title>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            outline: none !important;
            -webkit-tap-highlight-color: transparent;
        }
        body, html {
            width: 100%;
            height: 100%;
            background-color: #000;
            color: #fff;
            font-family: sans-serif;
            overflow: hidden;
            outline: none !important;
        }
        #video-player {
            width: 100vw;
            height: 100vh;
            object-fit: contain;
            background: #000;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
            outline: none !important;
        }
        #sidebar {
            position: absolute;
            top: 0;
            left: -400px;
            width: 400px;
            height: 100vh;
            background: rgba(15, 15, 15, 0.95);
            border-right: 2px solid #333;
            z-index: 10;
            transition: left 0.3s ease-in-out;
            display: flex;
            flex-direction: column;
        }
        #sidebar.visible {
            left: 0;
        }
        .sidebar-header {
            padding: 20px;
            background: #222;
            font-size: 22px;
            font-weight: bold;
            border-bottom: 1px solid #444;
        }
        #channel-list {
            flex: 1;
            overflow-y: auto;
            padding: 10px;
        }
        .channel-item {
            padding: 15px;
            margin-bottom: 8px;
            background: #2a2a2a;
            border-radius: 6px;
            cursor: pointer;
            font-size: 18px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            border: 2px solid transparent;
        }
        .channel-item.focused {
            border-color: #00ffcc;
            background: #3a3a3a;
        }
        .channel-item.active {
            background: #0055ff;
            color: #fff;
        }
        #osd-info {
            position: absolute;
            top: 30px;
            right: 30px;
            background: rgba(0, 0, 0, 0.8);
            padding: 15px 25px;
            border-radius: 8px;
            font-size: 24px;
            z-index: 5;
            opacity: 0;
            transition: opacity 0.3s ease;
            border: 1px solid #444;
        }
        #osd-info.show {
            opacity: 1;
        }
    </style>
</head>
<body>

    <video id="video-player" autoplay playsinline></video>

    <div id="osd-info">Channel -</div>

    <div id="sidebar">
        <div class="sidebar-header">Daftar Channel TV</div>
        <div id="channel-list"></div>
    </div>

    <script>
        const playlistUrl = 'https://raw.githubusercontent.com/arwantube/playlist-iptv/refs/heads/main/tv-indonesia.m3u';
        let channels = [];
        let currentIndex = 0;
        let focusedIndex = 0;
        let isSidebarVisible = false;
        let hideSidebarTimer = null;
        let osdTimer = null;

        const video = document.getElementById('video-player');
        const sidebar = document.getElementById('sidebar');
        const channelListContainer = document.getElementById('channel-list');
        const osdInfo = document.getElementById('osd-info');

        async function loadPlaylist() {
            try {
                const response = await fetch(playlistUrl);
                const text = await response.text();
                parseM3U(text);
                if (channels.length > 0) {
                    renderChannelList();
                    playChannel(0);
                }
            } catch (error) {
                console.error("Gagal memuat playlist:", error);
                osdInfo.innerText = "Gagal memuat playlist!";
                showOSD();
            }
        }

        function parseM3U(data) {
            const lines = data.split('\n');
            let currentChannel = {};

            lines.forEach(line => {
                line = line.trim();
                if (line.startsWith('#EXTINF:')) {
                    const tvgNameMatch = line.match(/tvg-name="([^"]*)"/);
                    const nameParts = line.split(',');
                    currentChannel.name = tvgNameMatch ? tvgNameMatch[1] : (nameParts[nameParts.length - 1] || "Unknown Channel");
                } else if (line && !line.startsWith('#')) {
                    currentChannel.url = line;
                    channels.push({ ...currentChannel });
                    currentChannel = {};
                }
            });
        }

        function renderChannelList() {
            channelListContainer.innerHTML = '';
            channels.forEach((channel, index) => {
                const div = document.createElement('div');
                div.className = `channel-item ${index === 0 ? 'focused' : ''}`;
                div.innerText = channel.name;
                div.dataset.index = index;
                channelListContainer.appendChild(div);
            });
        }

        function playChannel(index) {
            if (index < 0 || index >= channels.length) return;
            currentIndex = index;
            focusedIndex = index;

            const channel = channels[currentIndex];
            const streamUrl = channel.url;

            document.querySelectorAll('.channel-item').forEach((el, idx) => {
                el.classList.toggle('active', idx === currentIndex);
            });

            osdInfo.innerText = `${currentIndex + 1}. ${channel.name} (Memuat...)`;
            showOSD();

            if (window.hls) {
                window.hls.destroy();
            }

            if (Hls.isSupported() && streamUrl.includes('.m3u8')) {
                window.hls = new Hls();
                window.hls.loadSource(streamUrl);
                window.hls.attachMedia(video);
                
                window.hls.on(Hls.Events.MANIFEST_PARSED, () => {
                    video.play().catch(e => console.log("Autoplay dicegah:", e));
                    osdInfo.innerText = `${currentIndex + 1}. ${channel.name}`;
                    showOSD();
                });

                window.hls.on(Hls.Events.ERROR, (event, data) => {
                    if (data.fatal) {
                        switch (data.type) {
                            case Hls.ErrorTypes.NETWORK_ERROR:
                                console.error("Network error encountered", data);
                                window.hls.startLoad();
                                break;
                            case Hls.ErrorTypes.MEDIA_ERROR:
                                console.error("Media error encountered", data);
                                window.hls.recoverMediaError();
                                break;
                            default:
                                console.error("Unrecoverable error", data);
                                osdInfo.innerText = `${channel.name} (Gagal Diputar)`;
                                showOSD();
                                window.hls.destroy();
                                break;
                        }
                    }
                });
            } else {
                video.src = streamUrl;
                video.play().then(() => {
                    osdInfo.innerText = `${currentIndex + 1}. ${channel.name}`;
                    showOSD();
                }).catch(e => {
                    osdInfo.innerText = `${channel.name} (Gagal Diputar)`;
                    showOSD();
                });
            }
        }

        function toggleSidebar(show) {
            isSidebarVisible = show;
            if (show) {
                sidebar.classList.add('visible');
                updateFocus();
                resetHideTimer();
            } else {
                sidebar.classList.remove('visible');
                clearTimeout(hideSidebarTimer);
            }
        }

        function resetHideTimer() {
            clearTimeout(hideSidebarTimer);
            hideSidebarTimer = setTimeout(() => {
                if (isSidebarVisible) {
                    toggleSidebar(false);
                }
            }, 5000);
        }

        function showOSD() {
            osdInfo.classList.add('show');
            clearTimeout(osdTimer);
            osdTimer = setTimeout(() => {
                osdInfo.classList.remove('show');
            }, 3000);
        }

        function updateFocus() {
            const items = document.querySelectorAll('.channel-item');
            items.forEach((item, idx) => {
                if (idx === focusedIndex) {
                    item.classList.add('focused');
                    item.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
                } else {
                    item.classList.remove('focused');
                }
            });
        }

        window.addEventListener('keydown', (e) => {
            if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Enter'].includes(e.key)) {
                e.preventDefault();
            }

            if (isSidebarVisible) {
                switch (e.key) {
                    case 'ArrowUp':
                        if (focusedIndex > 0) {
                            focusedIndex--;
                            updateFocus();
                            resetHideTimer();
                        }
                        break;
                    case 'ArrowDown':
                        if (focusedIndex < channels.length - 1) {
                            focusedIndex++;
                            updateFocus();
                            resetHideTimer();
                        }
                        break;
                    case 'Enter':
                    case ' ':
                        playChannel(focusedIndex);
                        toggleSidebar(false);
                        break;
                    case 'ArrowLeft':
                    case 'Escape':
                    case 'Backspace':
                        toggleSidebar(false);
                        break;
                }
            } else {
                switch (e.key) {
                    case 'ArrowLeft':
                        focusedIndex = currentIndex;
                        toggleSidebar(true);
                        break;
                    case 'ArrowUp':
                        let nextIndex = (currentIndex + 1) % channels.length;
                        playChannel(nextIndex);
                        break;
                    case 'ArrowDown':
                        let prevIndex = (currentIndex - 1 + channels.length) % channels.length;
                        playChannel(prevIndex);
                        break;
                }
            }
        });

        loadPlaylist();
    </script>
</body>
</html>
